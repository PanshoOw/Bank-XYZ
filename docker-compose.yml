services:

  kafka:
    image: apache/kafka:latest
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    networks:
      - bankxyz-network


  discovery-server:
    build:
      context: ./discovery-server
    image: bankxyz-discovery-server:1.0
    container_name: bankxyz-discovery-server

    ports:
      - "8761:8761"

    networks:
      - bankxyz-network


  config-server:
    build:
      context: ./config-server
    image: bankxyz-config-server:1.0
    container_name: bankxyz-config-server

    ports:
      - "8888:8888"

    networks:
      - bankxyz-network


  auth-server:
    build:
      context: ./auth-server
    image: bankxyz-auth-server:1.0
    container_name: bankxyz-auth-server

    ports:
      - "9000:9000"

    environment:
      OAUTH_WEB_CLIENT_SECRET: ${OAUTH_WEB_CLIENT_SECRET}
      OAUTH_MOBILE_CLIENT_SECRET: ${OAUTH_MOBILE_CLIENT_SECRET}
      OAUTH_ATM_CLIENT_SECRET: ${OAUTH_ATM_CLIENT_SECRET}

      AUTH_SERVER_ISSUER_URI: http://auth-server:9000

    networks:
      - bankxyz-network


  backend:
    build:
      context: .
    image: bankxyz-backend:1.0
    container_name: bankxyz-backend

    ports:
      - "8080:8080"

    environment:
      ORACLE_WALLET_DIR: /wallet
      BANKXYZ_DB_PASSWORD: ${BANKXYZ_DB_PASSWORD}
      SPRING_BATCH_JOB_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    volumes:
      - type: bind
        source: ${ORACLE_WALLET_HOST_PATH}
        target: /wallet
        read_only: true

    depends_on:
      - kafka

    restart: on-failure

    networks:
      - bankxyz-network


  bff-web:
    build:
      context: ./bff-web
    image: bankxyz-bff-web:1.0
    container_name: bankxyz-bff-web

    ports:
      - "8081:8081"

    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      BACKEND_URL: http://backend:8080
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_SERVER_ISSUER_URI: http://auth-server:9000

      SERVER_SSL_KEY_STORE: file:/app/keystore.p12
      BFF_WEB_SSL_KEYSTORE_PASSWORD: ${BFF_WEB_SSL_KEYSTORE_PASSWORD}

    volumes:
      - type: bind
        source: ./bff-web/src/main/resources/keystore.p12
        target: /app/keystore.p12
        read_only: true

    depends_on:
      - config-server
      - discovery-server
      - auth-server
      - backend

    restart: on-failure

    networks:
      - bankxyz-network


  bff-mobile:
    build:
      context: ./bff-mobile
    image: bankxyz-bff-mobile:1.0
    container_name: bankxyz-bff-mobile

    ports:
      - "8082:8082"

    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      BACKEND_URL: http://backend:8080
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_SERVER_ISSUER_URI: http://auth-server:9000

      SERVER_SSL_KEY_STORE: file:/app/keystore.p12
      BFF_MOBILE_SSL_KEYSTORE_PASSWORD: ${BFF_MOBILE_SSL_KEYSTORE_PASSWORD}

    volumes:
      - type: bind
        source: ./bff-mobile/src/main/resources/keystore.p12
        target: /app/keystore.p12
        read_only: true

    depends_on:
      - config-server
      - discovery-server
      - auth-server
      - backend

    restart: on-failure

    networks:
      - bankxyz-network


  bff-atm:
    build:
      context: ./bff-atm
    image: bankxyz-bff-atm:1.0
    container_name: bankxyz-bff-atm

    ports:
      - "8083:8083"

    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      BACKEND_URL: http://backend:8080
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_SERVER_ISSUER_URI: http://auth-server:9000

      SERVER_SSL_KEY_STORE: file:/app/keystore.p12
      BFF_ATM_SSL_KEYSTORE_PASSWORD: ${BFF_ATM_SSL_KEYSTORE_PASSWORD}

    volumes:
      - type: bind
        source: ./bff-atm/src/main/resources/keystore.p12
        target: /app/keystore.p12
        read_only: true

    depends_on:
      - config-server
      - discovery-server
      - auth-server
      - backend

    restart: on-failure

    networks:
      - bankxyz-network


networks:
  bankxyz-network:
    name: bankxyz-network
    driver: bridge